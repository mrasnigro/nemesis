services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: imp
      MYSQL_DATABASE: imp
      MYSQL_USER: imp
      MYSQL_PASSWORD: imp
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uimp", "-pimp"]
      interval: 5s
      timeout: 5s
      retries: 20
