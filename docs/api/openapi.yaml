          type: integer
        retryNoAnswerMinutes:
          type: integer
        retryVoicemailMinutes:
          type: integer

    BdrTelephonySettingsWrite:
      type: object
      description: Omitted credentials keep their stored value. `simulated` is rejected in production.
      properties:
        provider:
          type: string
          enum: [none, simulated, falevono]
        baseUrl:
          type: string
          format: uri
          nullable: true
        apiToken:
          type: string
          format: password
