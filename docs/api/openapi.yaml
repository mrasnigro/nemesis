  /api/modules/bdr/dialer/attempts:
    get:
      tags: [Dialer]
      summary: Attempt history
      description: Every dial attempt, including unanswered ones that never reached the operator.
      operationId: listBdrAttempts
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: campaignId
          in: query
          schema:
            type: string
        - name: leadId
          in: query
          schema:
            type: string
        - name: outcome
          in: query
          schema:
            $ref: '#/components/schemas/BdrDialOutcome'
      responses:
        '200':
          description: Page of attempts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/BdrDialAttempt'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Dialer]
      summary: Dial the next queued lead of a campaign
      description: |
        Takes the next due lead, cancels any attempt this operator still has ringing, and asks the
        provider to originate. Poll the attempt; only a human answer moves it to `answered`.
      operationId: startBdrAttempt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [campaignId]
              properties:
                campaignId:
                  type: string
      responses:
        '201':
          description: Attempt ringing
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/BdrDialAttempt'
        '200':
          description: >
            No lead is due now. `queue` is the campaign lead summary; `queue.nextAttemptAt` is when the
            earliest scheduled lead becomes due (null when nothing is scheduled).
          content:
            application/json:
              schema:
                type: object
                required: [data, queue]
                properties:
                  data:
                    nullable: true
                    enum: [null]
                  queue:
                    type: object
                    properties:
                      total: { type: integer }
                      ready: { type: integer }
                      scheduled: { type: integer }
                      active: { type: integer }
                      done: { type: integer }
                      exhausted: { type: integer }
                      nextAttemptAt: { type: string, format: date-time, nullable: true }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: NOT_FOUND (campaign)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: CAMPAIGN_PAUSED, TELEPHONY_NOT_CONFIGURED, or NO_EXTENSION
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/modules/bdr/dialer/attempts/manual:
    post:
