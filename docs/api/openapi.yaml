                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ManagedUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/audit-logs:
    get:
      tags: [Admin]
      summary: Audit log
      description: Sign-ins and every admin change. Customer admins see only their customer's entries.
      operationId: listAuditLogs
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: customerId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Page of entries, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AuditLog'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/modules/webinar/handoff:
    post:
      tags: [Integrations]
      summary: Mint a one-time Webinar sign-in code
      description: |
        The API registers a handoff with the Webinar service using the server-side shared key
        (WEBINAR_HANDOFF_SHARED_KEY); the browser never sees that key. The browser then exchanges
        the code at the Webinar API (POST /api/auth/imp-handoff/exchange). Codes are single-use and
        expire within five minutes.
      operationId: createWebinarHandoff
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                returnTo:
                  type: string
                  format: uri
                  description: Accepted only if its origin is one of CORS_ORIGINS
      responses:
        '201':
          description: Code minted
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [code, expiresAt]
                    properties:
                      code:
                        type: string
                      expiresAt:
                        type: string
                        format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          description: INTEGRATION_UNAVAILABLE. The Webinar service did not answer or rejected the request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: INTEGRATION_NOT_CONFIGURED. WEBINAR_API_URL or the shared key is missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: imp_session
      description: HttpOnly session cookie issued by POST /api/auth/login

  parameters:
    Query:
      name: q
      in: query
      description: Search text applied in SQL
      schema:
        type: string
        maxLength: 200
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Sort:
      name: sort
      in: query
      description: Allow-listed field, optional leading minus for descending. Example createdAt or -createdAt
      schema:
        type: string
    From:
      name: from
      in: query
      schema:
        type: string
        format: date
    To:
      name: to
      in: query
      schema:
        type: string
        format: date
    ScenarioId:
      name: scenarioId
      in: path
      required: true
      schema:
        type: string
    PersonaId:
      name: personaId
      in: path
      required: true
      schema:
        type: string
    TemplateId:
      name: templateId
      in: path
      required: true
      schema:
        type: string
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
    CallId:
      name: callId
      in: path
      required: true
      schema:
        type: string
    MeetingId:
      name: meetingId
      in: path
      required: true
      schema:
        type: string
    CampaignId:
      name: campaignId
      in: path
      required: true
      schema:
        type: string
    AttemptId:
      name: attemptId
      in: path
      required: true
      schema:
        type: string
    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        type: string
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string

  responses:
    Conflict:
      description: Unique conflict (slug, username, or email already in use)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    BadRequest:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Missing or invalid session
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Module or role denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource not in the caller customer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok, error]
        version:
          type: string
        database:
          type: string
          enum: [up, down]
        timestamp:
          type: string
          format: date-time

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  path:
                    type: string
                  message:
                    type: string

    PageMeta:
      type: object
      required: [page, pageSize, total]
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer

    PageEnvelope:
      type: object
      required: [data, page]
      properties:
        page:
          $ref: '#/components/schemas/PageMeta'

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password

    ModuleId:
      type: string
      enum: [training-ai, bdr, prospecting, webinar, radar, vsl]

    UserProfile:
      type: string
      enum: [customer_admin, sdr_bdr, closer]

    User:
      type: object
      required: [id, username, name, role, customer, modules]
      properties:
        id:
          type: string
        username:
          type: string
        name:
          type: string
        email:
          type: string
          nullable: true
        role:
          type: string
          enum: [admin, imp]
          description: admin = IMP staff. imp = customer user
        profile:
          type: string
          enum: [customer_admin, sdr_bdr, closer]
          nullable: true
        customer:
          type: object
          nullable: true
          required: [id, name]
          properties:
            id:
              type: string
            name:
              type: string
        modules:
          type: array
          items:
            $ref: '#/components/schemas/ModuleId'
          description: Effective module ids (customer contract ∩ user grant). Empty for admin.

    UserEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/User'

    Difficulty:
      type: string
      enum: [beginner, intermediate, advanced]

    TrainingScenario:
      type: object
      required: [id, title, difficulty, funnelStage, personaId, evaluationTemplateId, createdAt]
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        industry:
          type: string
        objective:
          type: string
        difficulty:
          $ref: '#/components/schemas/Difficulty'
        durationMin:
          type: integer
        funnelStage:
          type: string
        focus:
          type: array
          items:
            type: string
        personaId:
          type: string
        evaluationTemplateId:
          type: string
        sellerInstructions:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TrainingScenarioWrite:
      type: object
      required: [title, difficulty, personaId, evaluationTemplateId]
      properties:
        title:
          type: string
        description:
          type: string
        industry:
          type: string
        objective:
          type: string
        difficulty:
          $ref: '#/components/schemas/Difficulty'
        durationMin:
          type: integer
        funnelStage:
          type: string
        focus:
          type: array
          items:
            type: string
        personaId:
          type: string
        evaluationTemplateId:
          type: string
        sellerInstructions:
          type: string

    TrainingPersona:
      type: object
      required: [id, name, status, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [active, paused, inactive, draft]
        industry:
          type: string
        difficulty:
          $ref: '#/components/schemas/Difficulty'
        negotiatorType:
          type: string
        salesModel:
          type: string
          enum: [b2b, b2c]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TrainingPersonaWrite:
      type: object
      required: [name]
      properties:
        name:
          type: string
        status:
          type: string
          enum: [active, paused, inactive, draft]
        industry:
          type: string
        difficulty:
          $ref: '#/components/schemas/Difficulty'
        negotiatorType:
          type: string
        salesModel:
          type: string
          enum: [b2b, b2c]

    TrainingTemplate:
      type: object
      required: [id, title, createdAt]
      properties:
        id:
          type: string
        title:
          type: string
        contactType:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TrainingTemplateWrite:
      type: object
      required: [title]
      properties:
        title:
          type: string
        description:
          type: string
        contactType:
          type: string
        status:
          type: string
          enum: [draft, published]
          description: Only published playbooks can score a session.
        sections:
          type: array
          description: Stages of the playbook. Criterion weights across all sections must add up to 100.
          items:
            type: object
            required: [name, criteria]
            properties:
              name:
                type: string
              criteria:
                type: array
                items:
                  type: object
                  required: [name, weight, passRule]
                  properties:
                    name:
                      type: string
                    weight:
                      type: number
                    yesNoQuestion:
                      type: string
                    passRule:
                      type: object
                      properties:
                        type:
                          type: string
                          enum: [keywords, avoid_keywords]
                        keywords:
                          type: array
                          items:
                            type: string

    TrainingStatus:
      type: object
      required: [ai, maxTurns]
      properties:
        ai:
          type: object
          required: [provider, label, ready]
          properties:
            provider:
              type: string
              enum: [builtin, openai]
            label:
              type: string
            ready:
              type: boolean
            reason:
              type: string
              nullable: true
              description: Why the provider is not ready.
        maxTurns:
          type: integer
          description: Trainee messages allowed per session.

    TrainingMetrics:
      type: object
      required: [completed, avgScore, pending, streakDays]
      properties:
        completed:
          type: integer
        avgScore:
          type: integer
        pending:
          type: integer
          description: Scenarios the user has not completed yet.
        streakDays:
          type: integer
          description: Consecutive days with a finished session, ending today or yesterday.

    TrainingMessage:
      type: object
      required: [id, role, speaker, text, timestamp]
      properties:
        id:
          type: string
        role:
          type: string
          enum: [ai, user]
        speaker:
          type: string
        text:
          type: string
        timestamp:
          type: string
          format: date-time

    TrainingSession:
      type: object
      description: Session summary, as listed in history.
      required: [id, scenarioId, status, mediaMode, createdAt]
      properties:
        id:
          type: string
        scenarioId:
          type: string
        personaId:
          type: string
          nullable: true
        userId:
          type: string
        status:
          type: string
          enum: [in_progress, completed]
        mediaMode:
          type: string
          enum: [text, voice]
        aiProvider:
          type: string
          nullable: true
        judgeSource:
          type: string
          nullable: true
          enum: [openai, openai+rules, rules]
        score:
          type: integer
          nullable: true
        scenarioTitle:
          type: string
          nullable: true
        personaName:
          type: string
          nullable: true
        templateTitle:
          type: string
          nullable: true
        band:
          type: object
          nullable: true
          properties:
            id:
              type: string
            label:
              type: string
            tone:
              type: string
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true

    TrainingSessionDetail:
      description: Session summary fields plus the transcript and, once finished, the report.
      allOf:
        - $ref: '#/components/schemas/TrainingSession'
        - type: object
          required: [messages]
          properties:
            messages:
              type: array
              items:
                $ref: '#/components/schemas/TrainingMessage'
            report:
              $ref: '#/components/schemas/TrainingReport'

    TrainingReport:
      type: object
      nullable: true
      description: Score and analysis of a finished session. The transcript is repeated in `messages`.
      properties:
        sessionId:
          type: string
        scenarioId:
          type: string
        scenarioTitle:
          type: string
        personaId:
          type: string
        personaName:
          type: string
        templateId:
          type: string
        templateTitle:
          type: string
        mediaMode:
          type: string
          enum: [text, voice]
        judgeSource:
          type: string
          enum: [openai, openai+rules, rules]
        score:
          type: integer
          minimum: 0
          maximum: 100
        band:
          type: object
          description: 90+ Excelente, 75+ Bom, 60+ Em desenvolvimento, else Precisa reforco.
          properties:
            id:
              type: string
            label:
              type: string
            tone:
              type: string
        sections:
          type: array
          items:
            type: object
        criteria:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              weight:
                type: number
              passed:
                type: boolean
              rationale:
                type: string
        strengths:
          type: array
          items:
            type: string
        improvements:
          type: array
          items:
            type: string
        coachNotes:
          type: string
        coachFeedback:
          type: array
          items:
            type: object
        nextSteps:
          type: array
          items:
            type: string
        messages:
          type: array
          items:
            $ref: '#/components/schemas/TrainingMessage'
        completedAt:
          type: string
          format: date-time
    BdrCampaign:
      type: object
      required: [id, name, status, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [active, paused]
        leads:
          type: integer
          description: Leads in the queue. Maintained by the server from the lead queue; not writable.
        completed:
          type: integer
          description: Leads that are done or exhausted. Maintained by the server.
        progress:
          type: integer
          minimum: 0
          maximum: 100
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    BdrMetrics:
      type: object
      required: [totalCalls, callsToday, averageDurationLabel, meetingsScheduled, callsGoal, meetingsGoal, weekDeltaPercent]
      properties:
        totalCalls:
          type: integer
        callsToday:
          type: integer
          description: Calls since 00:00 UTC.
        averageDurationLabel:
          type: string
          description: Average duration of the last 7 days, e.g. `1m 30s`.
        meetingsScheduled:
          type: integer
        callsGoal:
          type: integer
          description: Fixed daily target until per-customer goals exist.
        meetingsGoal:
          type: integer
        weekDeltaPercent:
          type: integer
          description: Calls in the last 7 days against the 7 days before. 100 when the previous week had none.

    BdrCampaignWrite:
      type: object
      required: [name]
      properties:
        name:
          type: string
        status:
          type: string
          enum: [active, paused]

    BdrCall:
      type: object
      description: >
        Link, qualification and callback are columns. The attendance form (diagnosis, notes, script progress and
        similar fields) is returned as extra properties.
      required: [id, phone, mode, callStatus, startedAt]
      additionalProperties: true
      properties:
        id:
          type: string
        campaignId:
          type: string
          nullable: true
        attemptId:
          type: string
          nullable: true
          description: Dial attempt that produced this call. Null for WhatsApp-mode manual calls.
        leadId:
          type: string
          nullable: true
        phone:
          type: string
        leadName:
          type: string
        company:
          type: string
        mode:
          type: string
          enum: [automatic, manual]
        callStatus:
          type: string
        qualificationId:
          type: string
          nullable: true
        callbackAt:
          type: string
          format: date-time
          nullable: true
        durationSeconds:
          type: integer
        meetingIds:
          type: array
          items:
            type: string
        meetings:
          type: array
          description: Meetings booked during the call (bdr_meetings.call_id).
          items:
            $ref: '#/components/schemas/BdrMeeting'
        recordingStatus:
          type: string
          enum: [none, pending, stored, missing, failed]
        recordingUrl:
          type: string
          nullable: true
          description: Present only when the recording is stored. Relative to the API origin.
        startedAt:
          type: string
          format: date-time

    BdrCallWrite:
      type: object
      description: >
        Saves a finished attendance. Unknown properties (diagnosis, notes, ...) are stored with the call.
        When attemptId is set, the attempt must belong to the caller and have been answered; it is closed,
        the lead is settled, and the recording download is scheduled.
      required: [phone, mode, callStatus]
      additionalProperties: true
      properties:
        campaignId:
          type: string
          nullable: true
        attemptId:
          type: string
          nullable: true
        phone:
          type: string
        leadName:
          type: string
        company:
          type: string
        mode:
          type: string
          enum: [automatic, manual]
        callStatus:
          type: string
        qualificationId:
          type: string
          nullable: true
          description: "`callback` and `no_contact` put the lead back in the queue."
        callbackAt:
          type: string
          format: date-time
          nullable: true
        meetingIds:
          type: array
          maxItems: 20
          items:
            type: string
          description: Meetings of the same customer to link to this call. Others are ignored.
        durationSeconds:
          type: integer

    BdrMeeting:
      type: object
      required: [id, leadName, startsAt]
      properties:
        id:
          type: string
        callId:
          type: string
          nullable: true
        leadName:
          type: string
        company:
          type: string
        phone:
          type: string
        email:
          type: string
        startsAt:
          type: string
          format: date-time
        notes:
          type: string
        recordingUrl:
          type: string
          nullable: true
          description: Recording of the linked call, when stored.

    BdrMeetingWrite:
      type: object
      required: [leadName, startsAt]
      properties:
        callId:
          type: string
        leadName:
          type: string
        company:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        startsAt:
          type: string
          format: date-time
        notes:
          type: string

    BdrLeadImport:
      type: object
      required: [leads]
      properties:
        source:
          type: string
          enum: [import, prospecting, manual]
          default: import
        leads:
          type: array
          minItems: 1
          maxItems: 5000
          items:
            type: object
            required: [phone]
            properties:
              phone:
                type: string
              name:
                type: string
              company:
                type: string

    BdrDialOutcome:
      type: string
      enum: [answered, busy, no_answer, voicemail, failed, cancelled, abandoned]

    BdrDialAttempt:
      type: object
      required: [id, status, phone, startedAt]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [ringing, answered, ended]
          description: Only a human answer becomes `answered`; that is when the operator is connected
        outcome:
          type: string
          enum: [answered, busy, no_answer, voicemail, failed, cancelled, abandoned]
          nullable: true
        phone:
          type: string
        campaignId:
          type: string
          nullable: true
        callId:
          type: string
          nullable: true
          description: Set once the operator saves the call disposition
        startedAt:
          type: string
          format: date-time
        answeredAt:
          type: string
          format: date-time
          nullable: true
        endedAt:
          type: string
          format: date-time
          nullable: true
        lead:
          type: object
          nullable: true
          additionalProperties: true

    BdrDialerConfig:
      type: object
      required: [provider, configured]
      properties:
        provider:
          type: string
          enum: [none, simulated, falevono]
        configured:
          type: boolean
        extension:
          type: string
          nullable: true
        ringTimeoutSeconds:
          type: integer
        maxAttempts:
          type: integer

    BdrTelephonySettings:
      type: object
      properties:
        provider:
          type: string
          enum: [none, simulated, falevono]
        baseUrl:
          type: string
          nullable: true
        hasCredentials:
          type: boolean
        deviceId:
          type: string
          nullable: true
        dialPrefix:
          type: string
        ringTimeoutSeconds:
          type: integer
        maxAttempts:
          type: integer
        retryBusyMinutes:
          type: integer
        retryNoAnswerMinutes:
          type: integer
        retryVoicemailMinutes:
          type: integer

    BdrTelephonySettingsWrite:
      type: object
      description: Omitted credentials keep their stored value. `simulated` is rejected in production.
      properties:
        provider:
          type: string
          enum: [none, simulated, falevono]
        baseUrl:
          type: string
          format: uri
          nullable: true
        apiToken:
          type: string
          format: password
          writeOnly: true
        apiKey:
          type: string
          format: password
          writeOnly: true
        deviceId:
          type: string
          nullable: true
        dialPrefix:
          type: string
          pattern: '^\d{0,8}$'
        ringTimeoutSeconds:
          type: integer
          minimum: 10
          maximum: 120
        maxAttempts:
          type: integer
          minimum: 1
          maximum: 20
        retryBusyMinutes:
          type: integer
          minimum: 1
          maximum: 10080
        retryNoAnswerMinutes:
          type: integer
          minimum: 1
          maximum: 10080
        retryVoicemailMinutes:
          type: integer
          minimum: 1
          maximum: 10080

    CustomerStatus:
      type: string
      enum: [active, trial, suspended]

    CustomerPlan:
      type: string
      enum: [Starter, Growth, Enterprise]

    Customer:
      type: object
      required: [id, name, slug, plan, status, modulesEnabled, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        plan:
          $ref: '#/components/schemas/CustomerPlan'
        status:
          $ref: '#/components/schemas/CustomerStatus'
        modulesEnabled:
          type: array
          items:
            $ref: '#/components/schemas/ModuleId'
        usersCount:
          type: integer
        activeUsers:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CustomerCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 200
        plan:
          allOf:
            - $ref: '#/components/schemas/CustomerPlan'
          default: Starter
        status:
          allOf:
            - $ref: '#/components/schemas/CustomerStatus'
          default: trial
        moduleIds:
          type: array
          items:
            $ref: '#/components/schemas/ModuleId'

    CustomerUpdate:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 200
        plan:
          $ref: '#/components/schemas/CustomerPlan'
        status:
          $ref: '#/components/schemas/CustomerStatus'

    ModuleAssignment:
      type: object
      required: [moduleIds]
      properties:
        moduleIds:
          type: array
          items:
            $ref: '#/components/schemas/ModuleId'

    ManagedUser:
      type: object
      required: [id, username, name, role, status, assignedModules, createdAt]
      properties:
        id:
          type: string
        customerId:
          type: string
          nullable: true
        customerName:
          type: string
          nullable: true
        username:
          type: string
        name:
          type: string
        email:
          type: string
          nullable: true
        role:
          type: string
          enum: [admin, imp]
        profile:
          type: string
          enum: [customer_admin, sdr_bdr, closer]
          nullable: true
        status:
          type: string
          enum: [active, invited, inactive]
        assignedModules:
          type: array
          description: Granted modules. Effective access also requires the customer contract
          items:
            $ref: '#/components/schemas/ModuleId'
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    UserCreate:
      type: object
      required: [username, name, password]
      properties:
        customerId:
          type: string
          nullable: true
          description: Required for imp users created by a platform admin. Forced to the caller's customer for customer admins
        username:
          type: string
          pattern: '^[a-z0-9._-]{3,80}$'
        name:
          type: string
        email:
          type: string
          format: email
          nullable: true
        password:
          type: string
          format: password
          minLength: 8
          writeOnly: true
        role:
          type: string
          enum: [admin, imp]
          default: imp
        profile:
          type: string
          enum: [customer_admin, sdr_bdr, closer]
          nullable: true
          default: sdr_bdr
        status:
          type: string
          enum: [active, invited, inactive]
          default: active
        moduleIds:
          type: array
          items:
            $ref: '#/components/schemas/ModuleId'

    UserUpdate:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
        email:
          type: string
          format: email
          nullable: true
        profile:
          $ref: '#/components/schemas/UserProfile'
        status:
          type: string
          enum: [active, invited, inactive]
        password:
          type: string
          format: password
          minLength: 8
          writeOnly: true

    AuditLog:
      type: object
      required: [id, action, summary, level, createdAt]
      properties:
        id:
          type: string
        customerId:
          type: string
          nullable: true
        actorName:
          type: string
        action:
          type: string
          example: user.login
        entityType:
          type: string
        entityId:
          type: string
          nullable: true
        summary:
          type: string
        level:
          type: string
          enum: [info, warning, error]
        createdAt:
          type: string
          format: date-time

security:
  - sessionCookie: []
