        deviceId:
          type: string
          nullable: true
        dialPrefix:
          type: string
          pattern: '^\d{0,8}$'
        ringTimeoutSeconds:
          type: integer
          minimum: 10
          maximum: 120
        maxAttempts:
          type: integer
          minimum: 1
          maximum: 20
        retryBusyMinutes:
          type: integer
          minimum: 1
          maximum: 10080
        retryNoAnswerMinutes:
          type: integer
          minimum: 1
          maximum: 10080
        retryVoicemailMinutes:
          type: integer
          minimum: 1
          maximum: 10080

