  /api/modules/bdr/campaigns/{campaignId}/leads:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
    post:
      tags: [Dialer]
      summary: Add leads to a campaign queue
      description: Imported list, Prospecção handoff (AI search), or manual entry. Phones are normalized; duplicates in the campaign and invalid numbers are counted and skipped.
      operationId: importBdrLeads
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BdrLeadImport'
      responses:
        '201':
          description: Import result plus the campaign's new queue counts
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      inserted:
                        type: integer
                      duplicates:
                        type: integer
                      invalid:
                        type: integer
                      summary:
                        type: object
                        additionalProperties:
                          type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
