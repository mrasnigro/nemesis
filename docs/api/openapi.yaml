openapi: 3.0.3
info:
  title: IMP Platform API
  version: 0.2.0
  description: |
    Contract for the IMP platform API served by apps/api. Every path in this file is implemented.
    Webinar is a different API, documented in docs/api/webinar.md; IMP reaches it only through
    POST /api/modules/webinar/handoff.

    The imp_session cookie authenticates the caller. customerId on writes comes from the
    session. List and detail queries are limited to that customer. Effective module access is
    the customer's contracted modules intersected with the user's granted modules.
  x-implementation-status: implemented

servers:
  - url: http://localhost:4000
    description: Local platform API (npm run dev:api). The web app reaches it as /platform-api.

tags:
  - name: System
    description: Process health
  - name: Auth
    description: Session login and the current user
  - name: Admin
    description: Customers, users, module contracts and grants, audit log. Platform admins see every customer; customer admins see their own
  - name: Integrations
    description: Server-to-server bridges to separately deployed products (Webinar)
  - name: Training
    description: Treinamento IA scenarios, personas, templates, and sessions
  - name: Dialer
    description: Discagem Automática campaigns, lead queue, dial attempts, calls, recordings, meetings, and telephony settings

paths:
  /health:
    get:
      tags: [System]
      summary: Process and database health
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Process is up and the database answered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Process is up and the database check failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Create a session
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session cookie set. Body is the current user.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: HttpOnly session cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: ACCOUNT_DISABLED (inactive user or no active customer) or CUSTOMER_SUSPENDED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: RATE_LIMITED. Too many attempts for this IP and username (LOGIN_RATE_LIMIT_MAX per 15 minutes)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Clear the session
      operationId: logout
      responses:
        '204':
          description: Session cookie cleared
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Current user and effective modules
      operationId: getMe
      responses:
        '200':
          description: Signed-in user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'

