        '403':
          $ref: '#/components/responses/Forbidden'

  /api/modules/bdr/dialer/config:
    get:
      tags: [Dialer]
      summary: Dialer readiness for the operator
      operationId: getBdrDialerConfig
      responses:
        '200':
          description: Provider, whether it is configured, the operator extension, and limits
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/BdrDialerConfig'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/modules/bdr/dialer/extension:
    put:
      tags: [Dialer]
      summary: Set the operator's PBX extension
      operationId: setBdrExtension
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [extension]
              properties:
                extension:
                  type: string
                  maxLength: 40
                  pattern: '^[\w.@-]+$'
      responses:
        '200':
          description: Saved. Returns the refreshed dialer config
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/BdrDialerConfig'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/modules/bdr/dialer/attempts:
    get:
      tags: [Dialer]
      summary: Attempt history
      description: Every dial attempt, including unanswered ones that never reached the operator.
      operationId: listBdrAttempts
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: campaignId
          in: query
          schema:
            type: string
        - name: leadId
          in: query
          schema:
            type: string
        - name: outcome
          in: query
          schema:
            $ref: '#/components/schemas/BdrDialOutcome'
      responses:
        '200':
          description: Page of attempts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/BdrDialAttempt'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Dialer]
      summary: Dial the next queued lead of a campaign
      description: |
        Takes the next due lead, cancels any attempt this operator still has ringing, and asks the
        provider to originate. Poll the attempt; only a human answer moves it to `answered`.
      operationId: startBdrAttempt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [campaignId]
              properties:
                campaignId:
                  type: string
      responses:
        '201':
          description: Attempt ringing
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/BdrDialAttempt'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: NOT_FOUND (campaign) or QUEUE_EMPTY (no lead is due now)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: CAMPAIGN_PAUSED, TELEPHONY_NOT_CONFIGURED, or NO_EXTENSION
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/modules/bdr/dialer/attempts/manual:
    post:
      tags: [Dialer]
      summary: Dial a typed number
      operationId: startBdrManualAttempt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                campaignId:
                  type: string
                  nullable: true
      responses:
        '201':
          description: Attempt ringing
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/BdrDialAttempt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: TELEPHONY_NOT_CONFIGURED or NO_EXTENSION
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/modules/bdr/dialer/attempts/{attemptId}:
    parameters:
      - $ref: '#/components/parameters/AttemptId'
    get:
      tags: [Dialer]
      summary: Poll an attempt
      description: Reconciles with the provider and classifies the result (answered, busy, no_answer, voicemail, failed).
      operationId: pollBdrAttempt
      responses:
        '200':
          description: Current attempt state
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/BdrDialAttempt'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/modules/bdr/dialer/attempts/{attemptId}/hangup:
    parameters:
      - $ref: '#/components/parameters/AttemptId'
    post:
      tags: [Dialer]
      summary: Hang up an attempt
      operationId: hangupBdrAttempt
      responses:
        '200':
          description: Attempt ended
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/BdrDialAttempt'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/modules/bdr/dialer/attempts/{attemptId}/outcome:
    parameters:
      - $ref: '#/components/parameters/AttemptId'
    post:
      tags: [Dialer]
      summary: Operator correction of an answered attempt
      description: Use when the provider reported an answer but the operator heard a machine, busy tone, or silence.
      operationId: markBdrAttemptOutcome
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome:
                  type: string
                  enum: [voicemail, no_answer, busy, failed]
      responses:
        '200':
          description: Attempt reclassified; the lead is requeued or closed per retry settings
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/BdrDialAttempt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/modules/bdr/telephony/settings:
    get:
      tags: [Dialer]
      summary: Customer telephony settings (customer admin)
      description: Credentials are stored encrypted and never returned; `hasCredentials` reports whether they are set.
      operationId: getBdrTelephonySettings
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/BdrTelephonySettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [Dialer]
      summary: Save telephony settings (customer admin)
      operationId: saveBdrTelephonySettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BdrTelephonySettingsWrite'
      responses:
        '200':
          description: Saved settings
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/BdrTelephonySettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/customers:
    get:
      tags: [Admin]
      summary: List customers
      description: Platform admins get every customer. A customer admin gets only their own.
      operationId: listCustomers
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/CustomerStatus'
      responses:
        '200':
          description: Page of customers
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Customer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Admin]
      summary: Create a customer (platform admin)
      operationId: createCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/admin/customers/{customerId}:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
    get:
      tags: [Admin]
      summary: Get a customer
      operationId: getCustomer
      responses:
        '200':
          description: Customer
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Customer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Admin]
      summary: Update name, plan, or status (platform admin)
      description: Setting status to suspended blocks sign-in for every user of the customer.
      operationId: updateCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/customers/{customerId}/modules:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
    put:
      tags: [Admin]
      summary: Replace the customer's contracted modules (platform admin)
      description: User grants for modules no longer contracted are removed in the same transaction.
      operationId: assignCustomerModules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModuleAssignment'
      responses:
        '200':
          description: Updated customer
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/users:
    get:
      tags: [Admin]
      summary: List users
      operationId: listUsers
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: customerId
          in: query
          description: Ignored for customer admins, who are always scoped to their own customer
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [active, invited, inactive]
        - name: role
          in: query
          schema:
            type: string
            enum: [admin, imp]
      responses:
        '200':
          description: Page of users
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ManagedUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Admin]
      summary: Create a user
      description: |
        Customer admins can create only `imp` users in their own customer. Module grants must be
        within the customer contract (MODULE_NOT_CONTRACTED otherwise).
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ManagedUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/admin/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Admin]
      summary: Get a user
      operationId: getUser
      responses:
        '200':
          description: User
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ManagedUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Admin]
      summary: Update a user
      description: A password change or deactivation revokes the user's existing sessions. Users cannot deactivate themselves.
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ManagedUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/admin/users/{userId}/modules:
    parameters:
      - $ref: '#/components/parameters/UserId'
    put:
      tags: [Admin]
      summary: Replace the user's module grants
      operationId: assignUserModules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModuleAssignment'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ManagedUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/audit-logs:
    get:
      tags: [Admin]
      summary: Audit log
      description: Sign-ins and every admin change. Customer admins see only their customer's entries.
      operationId: listAuditLogs
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: customerId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Page of entries, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AuditLog'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/modules/webinar/handoff:
    post:
      tags: [Integrations]
      summary: Mint a one-time Webinar sign-in code
      description: |
        The API registers a handoff with the Webinar service using the server-side shared key
        (WEBINAR_HANDOFF_SHARED_KEY); the browser never sees that key. The browser then exchanges
        the code at the Webinar API (POST /api/auth/imp-handoff/exchange). Codes are single-use and
        expire within five minutes.
      operationId: createWebinarHandoff
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                returnTo:
                  type: string
                  format: uri
                  description: Accepted only if its origin is one of CORS_ORIGINS
      responses:
        '201':
          description: Code minted
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [code, expiresAt]
                    properties:
                      code:
                        type: string
                      expiresAt:
                        type: string
                        format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          description: INTEGRATION_UNAVAILABLE. The Webinar service did not answer or rejected the request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: INTEGRATION_NOT_CONFIGURED. WEBINAR_API_URL or the shared key is missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: imp_session
      description: HttpOnly session cookie issued by POST /api/auth/login

  parameters:
    Query:
      name: q
      in: query
      description: Search text applied in SQL
      schema:
        type: string
        maxLength: 200
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Sort:
      name: sort
      in: query
      description: Allow-listed field, optional leading minus for descending. Example createdAt or -createdAt
      schema:
        type: string
    From:
      name: from
      in: query
      schema:
        type: string
        format: date
    To:
      name: to
      in: query
      schema:
        type: string
        format: date
    ScenarioId:
      name: scenarioId
      in: path
      required: true
      schema:
        type: string
    PersonaId:
      name: personaId
      in: path
      required: true
      schema:
        type: string
    TemplateId:
      name: templateId
      in: path
      required: true
      schema:
        type: string
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
    CallId:
      name: callId
      in: path
      required: true
      schema:
        type: string
    MeetingId:
      name: meetingId
      in: path
      required: true
      schema:
        type: string
    CampaignId:
      name: campaignId
      in: path
      required: true
      schema:
        type: string
    AttemptId:
      name: attemptId
      in: path
      required: true
      schema:
        type: string
    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        type: string
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string

  responses:
    Conflict:
      description: Unique conflict (slug, username, or email already in use)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    BadRequest:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Missing or invalid session
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Module or role denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource not in the caller customer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok, error]
        version:
          type: string
        database:
          type: string
          enum: [up, down]
        timestamp:
          type: string
          format: date-time

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  path:
                    type: string
                  message:
                    type: string

    PageMeta:
      type: object
      required: [page, pageSize, total]
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer

    PageEnvelope:
      type: object
      required: [data, page]
      properties:
        page:
          $ref: '#/components/schemas/PageMeta'

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password

    ModuleId:
      type: string
      enum: [training-ai, bdr, prospecting, webinar, radar, vsl]

    UserProfile:
      type: string
      enum: [customer_admin, sdr_bdr, closer]

    User:
      type: object
      required: [id, username, name, role, customer, modules]
      properties:
        id:
          type: string
        username:
          type: string
        name:
          type: string
        email:
          type: string
          nullable: true
        role:
          type: string
          enum: [admin, imp]
          description: admin = IMP staff. imp = customer user
        profile:
          type: string
          enum: [customer_admin, sdr_bdr, closer]
          nullable: true
        customer:
          type: object
          nullable: true
          required: [id, name]
          properties:
            id:
              type: string
            name:
              type: string
        modules:
          type: array
          items:
            $ref: '#/components/schemas/ModuleId'
          description: Effective module ids (customer contract ∩ user grant). Empty for admin.

    UserEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/User'

    Difficulty:
      type: string
      enum: [beginner, intermediate, advanced]

    TrainingScenario:
      type: object
      required: [id, title, difficulty, funnelStage, personaId, evaluationTemplateId, createdAt]
      properties:
        id:
          type: string
        title:
          type: string
        description:
