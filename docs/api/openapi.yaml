      enum: [Starter, Growth, Enterprise]

    Customer:
      type: object
      required: [id, name, slug, plan, status, modulesEnabled, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        plan:
          $ref: '#/components/schemas/CustomerPlan'
        status:
          $ref: '#/components/schemas/CustomerStatus'
        modulesEnabled:
          type: array
          items:
            $ref: '#/components/schemas/ModuleId'
        usersCount:
          type: integer
        activeUsers:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CustomerCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 200
        plan:
          allOf:
            - $ref: '#/components/schemas/CustomerPlan'
          default: Starter
        status:
          allOf:
            - $ref: '#/components/schemas/CustomerStatus'
          default: trial
        moduleIds:
          type: array
          items:
            $ref: '#/components/schemas/ModuleId'

    CustomerUpdate:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 200
        plan:
          $ref: '#/components/schemas/CustomerPlan'
        status:
          $ref: '#/components/schemas/CustomerStatus'

    ModuleAssignment:
      type: object
      required: [moduleIds]
      properties:
        moduleIds:
          type: array
          items:
            $ref: '#/components/schemas/ModuleId'

    ManagedUser:
      type: object
      required: [id, username, name, role, status, assignedModules, createdAt]
      properties:
        id:
          type: string
        customerId:
          type: string
          nullable: true
        customerName:
          type: string
          nullable: true
        username:
          type: string
        name:
          type: string
        email:
          type: string
          nullable: true
        role:
          type: string
          enum: [admin, imp]
        profile:
          type: string
          enum: [customer_admin, sdr_bdr, closer]
          nullable: true
        status:
          type: string
          enum: [active, invited, inactive]
        assignedModules:
          type: array
          description: Granted modules. Effective access also requires the customer contract
          items:
            $ref: '#/components/schemas/ModuleId'
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    UserCreate:
      type: object
      required: [username, name, password]
      properties:
        customerId:
          type: string
          nullable: true
          description: Required for imp users created by a platform admin. Forced to the caller's customer for customer admins
        username:
          type: string
          pattern: '^[a-z0-9._-]{3,80}$'
        name:
          type: string
        email:
          type: string
          format: email
          nullable: true
        password:
          type: string
          format: password
          minLength: 8
          writeOnly: true
        role:
          type: string
          enum: [admin, imp]
          default: imp
        profile:
          type: string
          enum: [customer_admin, sdr_bdr, closer]
          nullable: true
          default: sdr_bdr
        status:
          type: string
          enum: [active, invited, inactive]
          default: active
        moduleIds:
          type: array
          items:
            $ref: '#/components/schemas/ModuleId'

    UserUpdate:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
        email:
          type: string
          format: email
          nullable: true
        profile:
          $ref: '#/components/schemas/UserProfile'
        status:
          type: string
          enum: [active, invited, inactive]
        password:
          type: string
          format: password
          minLength: 8
          writeOnly: true

    AuditLog:
      type: object
      required: [id, action, summary, level, createdAt]
      properties:
        id:
          type: string
        customerId:
          type: string
          nullable: true
        actorName:
          type: string
        action:
          type: string
          example: user.login
        entityType:
          type: string
        entityId:
          type: string
          nullable: true
        summary:
          type: string
        level:
          type: string
          enum: [info, warning, error]
        createdAt:
          type: string
          format: date-time

