openapi: 3.0.3
info:
  title: IMP Platform API
  version: 0.2.0
  description: |
    Contract for the IMP platform API served by apps/api. Every path in this file is implemented.
    Webinar is a different API, documented in docs/api/webinar.md; IMP reaches it only through
    POST /api/modules/webinar/handoff.

    The imp_session cookie authenticates the caller. customerId on writes comes from the
    session. List and detail queries are limited to that customer. Effective module access is
    the customer's contracted modules intersected with the user's granted modules.
  x-implementation-status: implemented

servers:
  - url: http://localhost:4000
    description: Local platform API (npm run dev:api). The web app reaches it as /platform-api.

tags:
  - name: System
    description: Process health
  - name: Auth
    description: Session login and the current user
  - name: Admin
    description: Customers, users, module contracts and grants, audit log. Platform admins see every customer; customer admins see their own
  - name: Integrations
    description: Server-to-server bridges to separately deployed products (Webinar)
  - name: Training
    description: Treinamento IA scenarios, personas, templates, and sessions
  - name: Dialer
    description: Discagem Automática campaigns, lead queue, dial attempts, calls, recordings, meetings, and telephony settings

paths:
  /health:
    get:
      tags: [System]
      summary: Process and database health
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Process is up and the database answered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Process is up and the database check failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Create a session
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session cookie set. Body is the current user.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: HttpOnly session cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: ACCOUNT_DISABLED (inactive user or no active customer) or CUSTOMER_SUSPENDED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: RATE_LIMITED. Too many attempts for this IP and username (LOGIN_RATE_LIMIT_MAX per 15 minutes)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Clear the session
      operationId: logout
      responses:
        '204':
          description: Session cookie cleared
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Current user and effective modules
      operationId: getMe
      responses:
        '200':
          description: Signed-in user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/modules/training-ai/scenarios:
    get:
      tags: [Training]
      summary: List training scenarios
      operationId: listTrainingScenarios
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: difficulty
          in: query
          schema:
            $ref: '#/components/schemas/Difficulty'
        - name: funnelStage
          in: query
          schema:
            type: string
      responses:
        '200':
          description: One page of scenarios
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/TrainingScenario'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Training]
      summary: Create a training scenario
      operationId: createTrainingScenario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainingScenarioWrite'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/TrainingScenario'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/modules/training-ai/scenarios/{scenarioId}:
    parameters:
      - $ref: '#/components/parameters/ScenarioId'
    get:
      tags: [Training]
      summary: Get a training scenario
      operationId: getTrainingScenario
      responses:
        '200':
          description: Scenario
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/TrainingScenario'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Training]
      summary: Update a training scenario
      operationId: updateTrainingScenario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainingScenarioWrite'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/TrainingScenario'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Training]
      summary: Delete a training scenario
      description: Customer administrator only. 409 IN_USE while something still depends on it.
      operationId: deleteTrainingScenario
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/modules/training-ai/personas:
    get:
      tags: [Training]
      summary: List training personas
      operationId: listTrainingPersonas
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            type: string
            enum: [active, paused, inactive, draft]
      responses:
        '200':
          description: One page of personas
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/TrainingPersona'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Training]
      summary: Create a training persona
      operationId: createTrainingPersona
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainingPersonaWrite'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/TrainingPersona'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/modules/training-ai/personas/{personaId}:
    parameters:
      - $ref: '#/components/parameters/PersonaId'
    get:
      tags: [Training]
      summary: Get a training persona
      operationId: getTrainingPersona
      responses:
        '200':
          description: Persona
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/TrainingPersona'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Training]
      summary: Update a training persona
      operationId: updateTrainingPersona
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainingPersonaWrite'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/TrainingPersona'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Training]
      summary: Delete a training persona
      description: Customer administrator only. 409 IN_USE while something still depends on it.
      operationId: deleteTrainingPersona
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/modules/training-ai/templates:
    get:
      tags: [Training]
      summary: List evaluation templates
      operationId: listTrainingTemplates
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: One page of templates
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/TrainingTemplate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Training]
      summary: Create an evaluation template
      operationId: createTrainingTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainingTemplateWrite'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/TrainingTemplate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/modules/training-ai/templates/{templateId}:
    parameters:
      - $ref: '#/components/parameters/TemplateId'
    get:
      tags: [Training]
      summary: Get an evaluation template
      operationId: getTrainingTemplate
      responses:
        '200':
          description: Template
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/TrainingTemplate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Training]
      summary: Update an evaluation template
      operationId: updateTrainingTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainingTemplateWrite'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/TrainingTemplate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Training]
      summary: Delete a training template
      description: Customer administrator only. 409 IN_USE while something still depends on it.
      operationId: deleteTrainingTemplate
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/modules/training-ai/status:
    get:
      tags: [Training]
      summary: Whether practice sessions can run
      description: Reports the AI provider the server uses and whether it is ready. When it is not ready, starting a session returns 503 AI_NOT_CONFIGURED.
      operationId: getTrainingStatus
      responses:
        '200':
          description: Provider status
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/TrainingStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/modules/training-ai/metrics:
    get:
      tags: [Training]
      summary: The signed-in user's own training numbers
      operationId: getTrainingMetrics
      responses:
        '200':
          description: Metrics
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/TrainingMetrics'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/modules/training-ai/starter-catalog:
    post:
      tags: [Training]
      summary: Install the starter catalog
      description: Customer administrator only. Creates 3 playbooks, 3 personas and 3 scenarios. Allowed only while the customer has no catalog items (409 CATALOG_NOT_EMPTY otherwise).
      operationId: installTrainingStarterCatalog
      responses:
        '201':
          description: Installed
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [templates, personas, scenarios]
                    properties:
                      templates:
                        type: integer
                      personas:
                        type: integer
                      scenarios:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/modules/training-ai/sessions:
    get:
      tags: [Training]
      summary: List finished practice sessions
      description: A trainee sees their own sessions; the customer administrator sees everyone's. Newest first.
      operationId: listTrainingSessions
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: scenarioId
          in: query
          schema:
            type: string
        - name: status
          in: query
          description: Defaults to completed.
          schema:
            type: string
            enum: [in_progress, completed]
      responses:
        '200':
          description: One page of sessions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/TrainingSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Training]
      summary: Start a practice session
      description: |
        Creates the session and returns it with the persona's opening message. The AI provider must be ready
        (503 AI_NOT_CONFIGURED otherwise). The persona must be active and the scenario's playbook published.
      operationId: createTrainingSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scenarioId]
              properties:
                scenarioId:
                  type: string
                personaId:
                  type: string
                  description: Overrides the scenario's linked persona.
                mediaMode:
                  type: string
                  enum: [text, voice]
                  default: text
      responses:
        '201':
          description: Session started
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/TrainingSessionDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          description: AI_NOT_CONFIGURED. The server has no AI provider ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/modules/training-ai/sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [Training]
      summary: Get a session with its transcript and report
      description: A trainee reads their own sessions; the customer administrator reads any session of the customer.
      operationId: getTrainingSession
      responses:
        '200':
          description: Session
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/TrainingSessionDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/modules/training-ai/sessions/{sessionId}/messages:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [Training]
      summary: Send a message and get the persona's reply
      description: |
        Only the trainee who owns the session. The reply is produced on the server; the trainee's message and the
        reply are stored together, so a provider failure stores nothing. 409 codes: SESSION_CLOSED,
        SESSION_TURN_LIMIT, TURN_IN_PROGRESS (another message is still being answered).
        502 AI_PROVIDER_ERROR and 504 AI_PROVIDER_TIMEOUT report provider failures.
      operationId: sendTrainingMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 2000
      responses:
        '201':
          description: Stored turn
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [userMessage, aiMessage, traineeMessages, turnsLeft]
                    properties:
                      userMessage:
                        $ref: '#/components/schemas/TrainingMessage'
                      aiMessage:
                        $ref: '#/components/schemas/TrainingMessage'
                      traineeMessages:
                        type: integer
                      turnsLeft:
                        type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          description: AI_PROVIDER_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: AI_NOT_CONFIGURED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '504':
          description: AI_PROVIDER_TIMEOUT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/modules/training-ai/sessions/{sessionId}/finish:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [Training]
      summary: Finish the session and score it
      description: |
        Only the trainee who owns the session. The server judges the transcript against the scenario's playbook:
        with the AI provider when it is ready, otherwise (or when the provider fails) with the playbook's own
        keyword rules. `report.judgeSource` says which. Finishing twice returns the stored result.
        409 SESSION_EMPTY when the trainee sent no message.
      operationId: finishTrainingSession
      responses:
        '200':
          description: Finished session with its report
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/TrainingSessionDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/modules/bdr/campaigns:
    get:
      tags: [Dialer]
      summary: List dialer campaigns
      operationId: listBdrCampaigns
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            type: string
            enum: [active, paused]
      responses:
        '200':
          description: One page of campaigns
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/BdrCampaign'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Dialer]
      summary: Create a campaign
      operationId: createBdrCampaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BdrCampaignWrite'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/BdrCampaign'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/modules/bdr/calls:
    get:
      tags: [Dialer]
      summary: List calls
      description: History screen. Filters run in SQL.
      operationId: listBdrCalls
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: campaignId
          in: query
          schema:
            type: string
        - name: mode
          in: query
          schema:
            type: string
            enum: [automatic, manual]
        - name: callStatus
          in: query
          schema:
            type: string
        - name: qualificationId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: One page of calls
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/BdrCall'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Dialer]
      summary: Record a completed call
      operationId: createBdrCall
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BdrCallWrite'
      responses:
        '201':
          description: Stored
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
