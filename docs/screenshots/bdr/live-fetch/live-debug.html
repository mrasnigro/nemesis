
  <!DOCTYPE html>
  <html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRM IMP - Debug Logs</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        margin: 0;
        padding: 20px;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
      }
      h1, h2 {
        color: #f8fafc;
      }
      .log-section {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 20px;
        overflow-x: auto;
      }
      .log-content {
        white-space: pre-wrap;
        word-wrap: break-word;
        font-size: 12px;
        line-height: 1.4;
      }
      .status {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 15px;
        margin-bottom: 30px;
      }
      .status-item {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 8px;
        padding: 15px;
        text-align: center;
      }
      .status-value {
        font-size: 18px;
        font-weight: bold;
        color: #10b981;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🔧 CRM IMP - Debug Logs</h1>

      <div class="status">
        <div class="status-item">
          <div>Status</div>
          <div class="status-value">✅ Rodando</div>
        </div>
        <div class="status-item">
          <div>Porta</div>
          <div class="status-value">3000</div>
        </div>
        <div class="status-item">
          <div>Node.js</div>
          <div class="status-value">v18.20.8</div>
        </div>
      </div>

      <h2>📋 Server Logs</h2>
      <div class="log-section">
        <div class="log-content">No logs yet</div>
      </div>

      <h2>⚠️ Error Logs</h2>
      <div class="log-section">
        <div class="log-content">No errors yet</div>
      </div>
    </div>

    <script>
      setInterval(() => location.reload(), 5000);
    </script>
  </body>
  </html>
